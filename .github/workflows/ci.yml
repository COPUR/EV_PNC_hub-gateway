name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # JDK 21 until the Gradle 9.1+ move that JDK 25 (ADR-0012) needs; see docs/adr/0018-emsp-hub-adapter-framework.md.
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Pinned contracts
        run: tools/fetch-contracts.sh
      - name: Vendored profiles equal the pinned contracts
        run: tools/sync-contracts.sh --check
      - name: Build and test (adapter contract, conversion table coverage, pinned OICP contract)
        run: gradle build --no-daemon
        env:
          CONTRACTS_DIR: ${{ github.workspace }}/.contracts
